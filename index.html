<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FUEXAMFE - PDF Question Viewer</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">FE</span>
          <div>
            <h1>FUEXAMFE</h1>
            <p id="fileName">Chưa import dữ liệu</p>
          </div>
        </div>

        <div class="toolbar" aria-label="Thanh công cụ">
          <label class="file-button" for="pdfInput">
            <i data-lucide="file-up"></i>
            <span>Import PDF</span>
          </label>
          <input id="pdfInput" type="file" accept="application/pdf,.pdf">
          <label class="file-button secondary-file-button" for="imageInput">
            <i data-lucide="images"></i>
            <span>Import Ảnh</span>
          </label>
          <input id="imageInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp" multiple>

          <button id="exportPngBtn" type="button" title="Xuất câu hiện tại PNG">
            <i data-lucide="image-down"></i>
            <span>PNG</span>
          </button>
          <button id="exportJpgBtn" type="button" title="Xuất câu hiện tại JPG">
            <i data-lucide="image"></i>
            <span>JPG</span>
          </button>
          <button id="exportTextBtn" type="button" title="Tải text tất cả câu hỏi">
            <i data-lucide="file-text"></i>
            <span>TXT</span>
          </button>
          <button id="exportZipBtn" type="button" title="Xuất tất cả câu hỏi thành ZIP ảnh PNG">
            <i data-lucide="archive"></i>
            <span>Ảnh ZIP</span>
          </button>
          <button id="exportPdfBtn" type="button" title="Xuất tất cả câu hỏi thành PDF">
            <i data-lucide="file-down"></i>
            <span>PDF</span>
          </button>
        </div>
      </header>

      <section class="workspace">
        <aside class="panel left-panel">
          <div class="panel-head">
            <h2>Câu hỏi</h2>
            <span id="questionCount">0</span>
          </div>
          <div class="search-box">
            <i data-lucide="search"></i>
            <input id="searchInput" type="search" placeholder="Tìm câu hỏi">
          </div>
          <div id="questionList" class="question-list" aria-label="Danh sách câu hỏi"></div>
        </aside>

        <section class="stage">
          <div id="emptyState" class="empty-state">
            <i data-lucide="file-question"></i>
            <h2>Import PDF hoặc Ảnh</h2>
          </div>
          <div id="questionMount" class="question-mount" aria-live="polite"></div>
        </section>

        <aside class="panel right-panel">
          <div class="panel-head">
            <h2>Dữ liệu</h2>
            <span id="currentIndex">-</span>
          </div>

          <label class="field">
            <span>Đáp án</span>
            <input id="answerInput" type="text" maxlength="22" placeholder="A hoặc A, B, C">
          </label>

          <label class="field">
            <span>Loại câu</span>
            <select id="kindInput">
              <option value="Choose 1 answer">Choose 1 answer</option>
              <option value="Choose 2 answers">Choose 2 answers</option>
              <option value="Choose 3 answers">Choose 3 answers</option>
              <option value="Choose 4 answers">Choose 4 answers</option>
              <option value="Choose 5 answers">Choose 5 answers</option>
              <option value="Choose 6 answers">Choose 6 answers</option>
              <option value="Choose 7 answers">Choose 7 answers</option>
              <option value="Choose 8 answers">Choose 8 answers</option>
              <option value="Choose many answers">Choose many answers</option>
            </select>
          </label>

          <div class="field footer-setting">
            <span>Tên footer hiển thị</span>
            <div class="footer-controls">
              <input id="footerInput" type="text" value="FUEXAMFE" placeholder="FUEXAMFE">
              <button id="resetFooterBtn" type="button" title="Reset về FUEXAMFE">
                <i data-lucide="rotate-ccw"></i>
              </button>
            </div>
          </div>

          <label class="field">
            <span>Tên file export</span>
            <input id="exportNameInput" type="text" value="questions" placeholder="questions">
          </label>

          <label class="field">
            <span>Mã môn</span>
            <input id="subjectCodeInput" type="text" maxlength="24" placeholder="Ví dụ: DCD301">
          </label>

          <div class="field font-size-setting">
            <span>Cỡ chữ câu hỏi</span>
            <div class="font-size-controls">
              <input id="fontScaleInput" type="range" min="60" max="135" step="5" value="100" aria-label="Cỡ chữ câu hỏi">
              <input id="fontScaleNumberInput" type="number" min="60" max="135" step="5" value="100" aria-label="Phần trăm cỡ chữ">
              <button id="resetFontScaleBtn" type="button" title="Reset cỡ chữ">
                <i data-lucide="rotate-ccw"></i>
              </button>
            </div>
          </div>

          <div class="field ai-setting">
            <span>Đáp án khi import</span>
            <select id="importAnswerModeInput">
              <option value="keep">Dùng đáp án có sẵn trên đề</option>
              <option value="ai">AI tự chọn đáp án</option>
              <option value="blank">Không chọn đáp án</option>
            </select>
          </div>

          <div class="field">
            <span>Vùng chọn đáp án</span>
            <select id="answerControlsInput">
              <option value="show">Hiển thị</option>
              <option value="hide">Ẩn để tiết kiệm diện tích</option>
            </select>
          </div>

          <div class="field ai-setting">
            <span>Engine import PDF</span>
            <select id="pdfEngineInput">
              <option value="auto">Tự động</option>
              <option value="gemini">Google AI Studio</option>
              <option value="text">PDF text</option>
            </select>
          </div>

          <div class="field ai-setting">
            <span>Engine import ảnh</span>
            <select id="imageEngineInput">
              <option value="gemini">Google AI Studio</option>
              <option value="tesseract">Tesseract OCR</option>
            </select>
          </div>

          <label class="field">
            <span>Google AI Studio API Key</span>
            <input id="geminiKeyInput" type="password" autocomplete="off" placeholder="AIza... hoặc dùng .env">
          </label>

          <label class="field">
            <span>Gemini model</span>
            <select id="geminiModelInput">
              <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
              <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
            </select>
          </label>

          <button id="saveGeminiBtn" class="wide-button secondary-wide-button" type="button">
            <i data-lucide="key-round"></i>
            <span>Lưu cấu hình AI</span>
          </button>

          <button id="loadGeminiModelsBtn" class="wide-button secondary-wide-button" type="button">
            <i data-lucide="refresh-cw"></i>
            <span>Tải model khả dụng</span>
          </button>

          <label class="field grow">
            <span>Nội dung câu hỏi</span>
            <textarea id="stemInput" rows="8"></textarea>
          </label>

          <label class="field">
            <span>Lựa chọn</span>
            <textarea id="optionsInput" rows="5" placeholder="A. ...
B. ...
C. ...
D. ..."></textarea>
          </label>

          <button id="applyEditBtn" class="wide-button" type="button">
            <i data-lucide="check"></i>
            <span>Cập nhật</span>
          </button>

          <button id="cropImageBtn" class="wide-button secondary-wide-button" type="button">
            <i data-lucide="crop"></i>
            <span>Thêm/chỉnh vùng hình</span>
          </button>

          <button id="addQuestionBtn" class="wide-button secondary-wide-button" type="button">
            <i data-lucide="plus"></i>
            <span>Thêm câu mới</span>
          </button>

          <div class="danger-actions">
            <button id="deleteQuestionBtn" type="button">
              <i data-lucide="trash-2"></i>
              <span>Xóa câu hiện tại</span>
            </button>
            <button id="clearQuestionsBtn" type="button">
              <i data-lucide="trash"></i>
              <span>Xóa tất cả</span>
            </button>
          </div>

          <div class="mini-stats">
            <div>
              <strong id="pageCount">0</strong>
              <span>trang/ảnh</span>
            </div>
            <div>
              <strong id="parsedCount">0</strong>
              <span>câu đã tách</span>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="exportSandbox" aria-hidden="true"></div>

    <div id="cropModal" class="crop-modal" hidden>
      <div class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="cropDialogTitle">
        <div class="crop-dialog-head">
          <h2 id="cropDialogTitle">Chỉnh vùng hình</h2>
          <button id="closeCropBtn" type="button" title="Đóng">
            <i data-lucide="x"></i>
          </button>
        </div>
        <p>Kéo bên trong khung để di chuyển; kéo các góc để thay đổi kích thước.</p>
        <div id="cropStage" class="crop-stage">
          <img id="cropSourceImage" alt="Ảnh gốc để chỉnh vùng cắt">
          <div id="cropSelection" class="crop-selection">
            <span class="crop-handle nw" data-handle="nw"></span>
            <span class="crop-handle ne" data-handle="ne"></span>
            <span class="crop-handle sw" data-handle="sw"></span>
            <span class="crop-handle se" data-handle="se"></span>
          </div>
        </div>
        <div class="crop-dialog-actions">
          <button id="removeQuestionImageBtn" class="danger-crop-button" type="button">Xóa hình khỏi câu</button>
          <button id="cancelCropBtn" type="button">Hủy</button>
          <button id="saveCropBtn" type="button">Lưu vùng cắt</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/settings.js"></script>
    <script src="assets/js/parsers.js"></script>
    <script src="assets/js/gemini.js"></script>
    <script src="assets/js/image-processing.js"></script>
    <script src="assets/js/importers.js"></script>
    <script src="assets/js/questions-ui.js"></script>
    <script src="assets/js/exporters.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
